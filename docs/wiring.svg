<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect width="1180" height="720" fill="#fafafa"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Combact-Bot — مخطط التوصيل / Wiring (ESP32 + 4-channel DC motor driver)</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#666">firmware/src/config.h — PWM on IN1 = forward, PWM on IN2 = reverse, EN optional (held HIGH)</text>

  <!-- ESP32 -->
  <rect x="60" y="110" width="250" height="470" rx="12" fill="#1b2a41" stroke="#0d1620" stroke-width="2"/>
  <text x="185" y="140" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">ESP32 DevKit (38-pin)</text>
  <text x="185" y="160" text-anchor="middle" fill="#9fb3c8" font-size="12">ESP32-D0WD-V3 · CH340 · 4MB</text>
  <rect x="150" y="175" width="70" height="35" rx="3" fill="#333" stroke="#777"/>
  <text x="185" y="197" text-anchor="middle" fill="#ddd" font-size="11">micro-USB</text>

  <!-- pin labels on right edge of ESP32 -->
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="300" y="250" text-anchor="end">GPIO25</text>
    <text x="300" y="275" text-anchor="end">GPIO26</text>
    <text x="300" y="300" text-anchor="end">GPIO27</text>
    <text x="300" y="340" text-anchor="end">GPIO32</text>
    <text x="300" y="365" text-anchor="end">GPIO33</text>
    <text x="300" y="390" text-anchor="end">GPIO14</text>
    <text x="300" y="430" text-anchor="end">GPIO18</text>
    <text x="300" y="455" text-anchor="end">GPIO19</text>
    <text x="300" y="480" text-anchor="end">GPIO23</text>
    <text x="300" y="520" text-anchor="end">GND</text>
    <text x="300" y="550" text-anchor="end">VIN (5V)</text>
  </g>
  <g fill="#9fb3c8" font-size="11">
    <text x="70" y="250">يسار أمام</text>
    <text x="70" y="275">يسار خلف</text>
    <text x="70" y="300">يسار EN</text>
    <text x="70" y="340">يمين أمام</text>
    <text x="70" y="365">يمين خلف</text>
    <text x="70" y="390">يمين EN</text>
    <text x="70" y="430">مطرقة ضرب</text>
    <text x="70" y="455">مطرقة رجوع</text>
    <text x="70" y="480">مطرقة EN</text>
    <text x="70" y="520">أرضي مشترك</text>
    <text x="70" y="550">تغذية 5V</text>
    <text x="70" y="575" fill="#f0c674">GPIO34 ← مقسوم بطارية (اختياري)</text>
  </g>

  <!-- Driver -->
  <rect x="520" y="110" width="260" height="470" rx="12" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="650" y="140" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Motor driver — 4 CH</text>
  <text x="650" y="160" text-anchor="middle" fill="#c8e6c9" font-size="12">درايفر DC أربع قنوات</text>
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="530" y="230" font-size="13" fill="#c8e6c9">CH1 — محرك يسار</text>
    <text x="530" y="250">IN1</text><text x="530" y="275">IN2</text><text x="530" y="300">EN*</text>
    <text x="530" y="320" font-size="13" fill="#c8e6c9">CH2 — محرك يمين</text>
    <text x="530" y="340">IN1</text><text x="530" y="365">IN2</text><text x="530" y="390">EN*</text>
    <text x="530" y="410" font-size="13" fill="#c8e6c9">CH3 — المطرقة</text>
    <text x="530" y="430">IN1</text><text x="530" y="455">IN2</text><text x="530" y="480">EN*</text>
    <text x="530" y="520">GND</text>
    <text x="530" y="550">5V OUT*</text>
    <text x="530" y="505" font-size="12" fill="#c8e6c9">CH4 — احتياط (فارغ)</text>
    <text x="770" y="250" text-anchor="end">OUT1 / OUT2</text>
    <text x="770" y="340" text-anchor="end">OUT1 / OUT2</text>
    <text x="770" y="430" text-anchor="end">OUT1 / OUT2</text>
    <text x="770" y="600" text-anchor="end">VM (+)   GND (−)</text>
  </g>

  <!-- Signal wires ESP32 -> driver -->
  <g stroke-width="2.5" fill="none">
    <path d="M310 245 H520" stroke="#e53935"/>
    <path d="M310 270 H520" stroke="#e53935"/>
    <path d="M310 295 H520" stroke="#e53935" stroke-dasharray="6 4"/>
    <path d="M310 335 H520" stroke="#1e88e5"/>
    <path d="M310 360 H520" stroke="#1e88e5"/>
    <path d="M310 385 H520" stroke="#1e88e5" stroke-dasharray="6 4"/>
    <path d="M310 425 H520" stroke="#fb8c00"/>
    <path d="M310 450 H520" stroke="#fb8c00"/>
    <path d="M310 475 H520" stroke="#fb8c00" stroke-dasharray="6 4"/>
    <path d="M310 515 H520" stroke="#000"/>
    <path d="M520 545 H310" stroke="#d32f2f" stroke-dasharray="6 4"/>
  </g>
  <text x="415" y="240" text-anchor="middle" font-size="11" fill="#555">PWM</text>
  <text x="415" y="510" text-anchor="middle" font-size="11" fill="#000" font-weight="bold">GND مشترك (إلزامي)</text>
  <text x="415" y="562" text-anchor="middle" font-size="11" fill="#d32f2f">5V → VIN (أو منظّم 5V منفصل)</text>

  <!-- Motors -->
  <g>
    <circle cx="900" cy="245" r="38" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
    <text x="900" y="241" text-anchor="middle" font-size="12" font-weight="bold">M يسار</text>
    <text x="900" y="257" text-anchor="middle" font-size="11">Left wheel</text>
    <circle cx="900" cy="335" r="38" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
    <text x="900" y="331" text-anchor="middle" font-size="12" font-weight="bold">M يمين</text>
    <text x="900" y="347" text-anchor="middle" font-size="11">Right wheel</text>
    <circle cx="900" cy="425" r="38" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
    <text x="900" y="421" text-anchor="middle" font-size="12" font-weight="bold">M مطرقة</text>
    <text x="900" y="437" text-anchor="middle" font-size="11">Hammer</text>
  </g>
  <g stroke="#455a64" stroke-width="2.5" fill="none">
    <path d="M780 240 H862"/><path d="M780 250 H862"/>
    <path d="M780 330 H862"/><path d="M780 340 H862"/>
    <path d="M780 420 H862"/><path d="M780 430 H862"/>
  </g>
  <text x="1000" y="300" font-size="11" fill="#555">لو دار محرك بالعكس:</text>
  <text x="1000" y="316" font-size="11" fill="#555">اعكس سلكَيه على OUT1/OUT2</text>

  <!-- Battery -->
  <rect x="560" y="630" width="180" height="60" rx="8" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>
  <text x="650" y="655" text-anchor="middle" font-size="14" font-weight="bold">بطارية / Battery</text>
  <text x="650" y="675" text-anchor="middle" font-size="11">(+) → VM     (−) → GND</text>
  <g stroke-width="3" fill="none">
    <path d="M600 630 V580" stroke="#d32f2f"/>
    <path d="M700 630 V580" stroke="#000"/>
  </g>
  <text x="590" y="608" text-anchor="end" font-size="11" fill="#d32f2f">+</text>
  <text x="712" y="608" font-size="11">−</text>
  <text x="890" y="650" font-size="12" fill="#b71c1c" font-weight="bold">⚠ لا توصل البطارية مباشرة بالـ ESP32</text>
  <text x="890" y="670" font-size="11" fill="#555">ESP32 يحتاج 5V على VIN (من 5V OUT أو منظّم). مكثف ≥100µF على مدخل الدرايفر.</text>

  <!-- Battery sense -->
  <g stroke="#f0c674" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <path d="M600 600 H420 V570 H310"/>
  </g>
  <text x="330" y="612" font-size="11" fill="#8d6e00">10kΩ → GPIO34 → 3.3kΩ → GND (اختياري)</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <text x="60" y="640" font-weight="bold">Legend:</text>
    <line x1="60" y1="658" x2="100" y2="658" stroke="#555" stroke-width="2.5"/><text x="108" y="662">سلك إشارة (PWM)</text>
    <line x1="60" y1="680" x2="100" y2="680" stroke="#555" stroke-width="2.5" stroke-dasharray="6 4"/><text x="108" y="684">اختياري — EN* فقط إذا الدرايفر فيه رجل EN، وإلا اتركها غير موصولة</text>
    <text x="60" y="706" fill="#777">تجنّب على ESP32: GPIO 0/2/12/15 (إقلاع)، 6–11 (فلاش)، 34–39 (إدخال فقط)</text>
  </g>
</svg>

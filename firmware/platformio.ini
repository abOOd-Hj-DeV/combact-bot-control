; Combat robot firmware — ESP32 (Arduino framework, C++)
; Build:   pio run -e esp32dev
; Flash:   pio run -e esp32dev -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Native environment is used only to compile the pure-C++ units
; (protocol / mixer / failsafe) on the host for quick sanity builds.
; The real unit tests are plain-assert programs under test/host/.
[env:native]
platform = native
build_src_filter =
    +<protocol.cpp>
    +<mixer.cpp>
    +<failsafe.cpp>
build_flags =
    -std=c++17
